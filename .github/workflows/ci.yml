name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - name: fmt（硬门）
        run: cargo fmt --all -- --check
      - name: clippy（硬门，含测试代码）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  shell-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: install.sh 语法与错误级 lint
        run: |
          bash -n install.sh
          shellcheck -S error install.sh

  # 不建 release、不打 tag：只验证 release 构建能过，避免用 rc tag 试管道
  release-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p ebouncer-cli
      - name: 二进制冒烟（不发布）
        run: |
          ./target/x86_64-unknown-linux-musl/release/ebc --version
          ./target/x86_64-unknown-linux-musl/release/ebc demo
          ./target/x86_64-unknown-linux-musl/release/ebc audit-verify || true
