name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - name: fmt（硬门）
        run: cargo fmt --all -- --check
      - name: clippy（硬门，含测试代码）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  shell-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: install.sh 语法与错误级 lint
        run: |
          bash -n install.sh
          shellcheck -S error install.sh
      - name: install.ps1 语法（Windows PowerShell 5.1 兼容，且无 BOM）
        shell: pwsh
        run: |
          $path = "install.ps1"
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "install.ps1 must not start with a UTF-8 BOM (breaks irm | iex)"
          }
          foreach ($b in $bytes) {
            if ($b -gt 0x7F) { throw "install.ps1 must stay ASCII-only (byte $b found)" }
          }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          Write-Host "install.ps1 syntax OK (ASCII, no BOM)"

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build -q -p ebouncer-cli
      - name: 行为验收（G2–G6 自动化部分）
        run: bash scripts/release-check.sh --fast

  # 不建 release、不打 tag：只验证 release 构建能过，避免用 rc tag 试管道
  release-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p ebouncer-cli
      - name: 二进制冒烟（不发布）
        run: |
          ./target/x86_64-unknown-linux-musl/release/ebc --version
          ./target/x86_64-unknown-linux-musl/release/ebc demo
          ./target/x86_64-unknown-linux-musl/release/ebc audit-verify || true
