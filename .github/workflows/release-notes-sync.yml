name: release-notes-sync

# 改了统一说明后，同步到 rc.10 的 release 正文。
# 注意：GitHub 的 "latest release" 对纯 prerelease 仓库不稳定，这里显式指定 tag；
# 以后的新 tag 由 release.yml 的 body_path 自动带上同一份说明。
on:
  push:
    paths:
      - ".github/RELEASE_NOTES.md"
      - ".github/workflows/release-notes-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生成带 Full Changelog 的正文
        run: |
          set -euo pipefail
          prev=$(git tag --sort=-v:refname | grep -Fxv "v0.1.0-rc.10" | head -1 || true)
          {
            cat .github/RELEASE_NOTES.md
            echo
            if [ -n "${prev:-}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...v0.1.0-rc.10"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
      - name: 更新 rc.10 release 正文
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-rc.10
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: true
