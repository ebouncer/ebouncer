name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p ebouncer-cli
      - name: package
        run: |
          cd target/x86_64-unknown-linux-musl/release
          tar -czf "ebouncer-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" ebc
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: target/x86_64-unknown-linux-musl/release/*.tar.gz
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p ebouncer-cli
      - name: package
        shell: pwsh
        run: Compress-Archive -Path target/release/ebc.exe -DestinationPath "ebouncer-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc
          path: "*.zip"
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # rc/预发布标签自动标记 prerelease：install.sh 的 stable 渠道不会装到它
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            安装：`curl -fsSL https://raw.githubusercontent.com/ebouncer/ebouncer/main/install.sh | sh`
            产物经 sha256sums 校验（checksums.txt）。cosign/SLSA 签名在 v0.3 引入。
  install-smoke:
    # 真 Linux 端到端：一行安装 → doctor → demo → ledger → audit-verify。
    # 开发者机器无 WSL 时，这里就是 Linux/musl 分支的验证场；发布不过此关不算发完。
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 下载安装脚本（不要 pipe，避免 curl 失败被 sh 吞掉）
        run: curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors -o /tmp/install.sh "https://raw.githubusercontent.com/ebouncer/ebouncer/${GITHUB_REF_NAME}/install.sh"
      - name: 安装（资产刚上传，CDN 可能延迟）
        run: |
          set -eu
          sleep 10
          sh /tmp/install.sh
        env:
          EBC_VERSION: ${{ github.ref_name }}
      - name: PATH 兜底（runner 不重开 shell）
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ebc doctor
      - run: ebc demo
      - run: ebc ledger --days 7
      - run: ebc audit-verify
