[workspace]
resolver = "3"
members = [
    "crates/ebouncer-core",
    "crates/ebouncer-adapters",
    "crates/ebouncer-cli",
    "crates/ebouncer-rules",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ebouncer/ebouncer"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
regex = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ebouncer-core = { path = "crates/ebouncer-core" }
ebouncer-adapters = { path = "crates/ebouncer-adapters" }
ebouncer-rules = { path = "crates/ebouncer-rules" }

[profile.release]
lto = "thin"
strip = true
