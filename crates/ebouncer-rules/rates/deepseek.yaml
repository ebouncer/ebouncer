# 费率：deepseek（官方定价页 https://api-docs.deepseek.com/zh-cn/quick_start/pricing/ 于 2026-11-02 核实）
# 口径说明：官方分高峰/空闲两档（空闲为高峰半价；周一至周五 9:00-12:00、14:00-18:00 为高峰，
# 周末与法定节假日全天为空闲）。v0.1 简化：统一按【高峰价】计（略高估，可接受）；
# 时段化计费进 v0.2 backlog。
vendor: deepseek
currency: CNY
effective_from: "2026-11-01"
models:
  - name: deepseek-flash        # 官方模型：DeepSeek-V4.1-Flash-1017
    input_per_mtok: 2.0         # 高峰 · 缓存未命中
    output_per_mtok: 8.0        # 高峰
    cache_read_per_mtok: 0.04   # 高峰 · 缓存命中
  - name: deepseek-chat         # 旧名称：官方注明请求由 V4.1-Flash 服务并按 Flash 价计费
    input_per_mtok: 2.0
    output_per_mtok: 8.0
    cache_read_per_mtok: 0.04
tool_requests:
  # 已核验：每 1000 次【成功】请求 5 元，失败/无结果不计费（2026-11-01 起执行）
  search_per_k: 5.0
  fetch_per_k: 5.0
